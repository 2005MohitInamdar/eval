<div class="relative min-h-screen bg-white flex items-center justify-center p-6 overflow-hidden">

    <!-- Soft accent glow, consistent with your other standalone screens -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full pointer-events-none bg-orange-100/50 blur-3xl"></div>

    <div class="relative z-10 bg-white border border-slate-200 rounded-3xl shadow-xl p-10 max-w-md w-full text-center space-y-6">

        <!-- Icon tile -->
        <div class="fade-in flex justify-center" style="animation-delay: 0ms;">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
            </div>
        </div>

        <!-- Header -->
        <div class="fade-in space-y-2" style="animation-delay: 100ms;">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Verify your email</h1>
            <p class="text-slate-500 leading-relaxed">
                We've sent a verification link to your inbox. Click it to activate your account and get started.
            </p>
        </div>

        <!-- CTA -->
        
        <a href="https://mail.google.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="fade-in group w-full bg-orange-500 hover:bg-orange-600 text-white font-black text-lg px-8 py-4 rounded-xl shadow-lg shadow-orange-500/25 transition-all duration-300 flex items-center justify-center gap-2"
            style="animation-delay: 200ms;"
        >
            Open Email
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor"
                class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
        </a>

        <!-- Fine print -->
        <p class="fade-in text-sm text-slate-400" style="animation-delay: 250ms;">
            Didn't get an email? Check your spam folder, or wait a few minutes and try again.
        </p>

    </div>
</div>
