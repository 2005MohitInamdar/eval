<div class="min-h-screen bg-white text-slate-900 flex items-center justify-center">
    <div class="w-[80%] py-[15vh]">
        <div class="flex items-center gap-5 mb-12 fade-in" style="animation-delay: 0ms;">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-300">
                <span class="text-white font-black text-3xl">E</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight">Welcome Back!</h1>
        </div>

        <app-auth-ui-wrapper>
            @if (errorMessage()) {
                <p class="text-red-500 text-sm font-medium text-center mb-3 fade-in">
                    {{ errorMessage() }}
                </p>
            }
            <button 
                belowFields
                type="submit"
                [disabled]="isSubmitting()"
                (click)="loginUser(authService.authForm.value)"
                class="w-full py-4 bg-orange-500 text-white font-black text-2xl rounded-xl hover:bg-orange-600 transition-all duration-300 shadow-lg shadow-orange-500/25 fade-in"
                style="animation-delay: 400ms;"
            >
                {{ isSubmitting() ? 'Logging in...' : 'Login' }}
            </button>
            <div class="h-full flex flex-col justify-between">
                <div class="fade-in" style="animation-delay: 500ms;">
                    <p class="text-lg uppercase tracking-widest font-semibold mb-2 text-center">Quick access</p>
                    <button
                        type="button"
                        (click)="loginWithGoogle()"
                        class="w-full flex items-center justify-center gap-2 border-2 border-orange-400 hover:border-orange-300 hover:bg-orange-50 rounded-xl py-3 text-slate-700 transition-all duration-300 text-sm font-semibold"
                    >
                        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </div>
                <div class="text-center fade-in" style="animation-delay: 600ms;">
                    <p class="text-lg text-slate-500 font-medium mb-3">No credentials!?</p>
                    <a 
                        routerLink="/auth/signup" 
                        class="block w-full py-5 bg-orange-100 text-orange-700 font-black text-3xl rounded-xl hover:bg-orange-200 transition-all duration-300 cursor-pointer"
                    >
                        Signup!
                    </a>
                </div>
            </div>
        </app-auth-ui-wrapper>
    </div>
</div>
