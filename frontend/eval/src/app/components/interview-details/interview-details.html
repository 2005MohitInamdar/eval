<div class="relative min-h-screen bg-white flex items-center justify-center p-6 overflow-hidden">

    <!-- Soft accent glow, matches your other setup screens -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full pointer-events-none bg-orange-100/50 blur-3xl"></div>

    <form class="relative z-10">
        <div class="bg-white border border-slate-200 rounded-3xl shadow-xl p-8 md:p-10 space-y-8 w-full max-w-lg">

            <!-- Header -->
            <div class="flex items-center gap-3 fade-in" style="animation-delay: 0ms;">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Set up your interview</h1>
                    <p class="text-slate-500 text-sm mt-0.5">Tell us what you'd like to practice today.</p>
                </div>
            </div>

            <!-- Error banner -->
            <div *ngIf="errorMessage" class="flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl p-4 fade-in" style="animation-delay: 0ms;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#EF4444" class="w-5 h-5 flex-shrink-0 mt-0.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.007v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-sm text-red-700 font-medium">{{ errorMessage }}</p>
            </div>

            <!-- Interview type -->
            <div class="space-y-3 fade-in" style="animation-delay: 100ms;">
                <label class="text-xs font-bold tracking-[0.15em] text-slate-500 uppercase">Type of interview</label>
                <div class="grid grid-cols-3 gap-3">
                    <button
                        type="button"
                        [disabled]="isSubmitting"
                        (click)="interviewType('Technical Interview')"
                        [class.bg-orange-500]="interview_type === 'Technical Interview'"
                        [class.text-white]="interview_type === 'Technical Interview'"
                        [class.border-orange-500]="interview_type === 'Technical Interview'"
                        [class.bg-white]="interview_type !== 'Technical Interview'"
                        [class.text-slate-600]="interview_type !== 'Technical Interview'"
                        [class.border-slate-200]="interview_type !== 'Technical Interview'"
                        class="border-2 rounded-xl py-3 px-2 font-bold text-sm transition-all duration-200 hover:border-orange-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Technical
                    </button>

                    <button
                        type="button"
                        [disabled]="isSubmitting"
                        (click)="interviewType('Behavioral Interview')"
                        [class.bg-orange-500]="interview_type === 'Behavioral Interview'"
                        [class.text-white]="interview_type === 'Behavioral Interview'"
                        [class.border-orange-500]="interview_type === 'Behavioral Interview'"
                        [class.bg-white]="interview_type !== 'Behavioral Interview'"
                        [class.text-slate-600]="interview_type !== 'Behavioral Interview'"
                        [class.border-slate-200]="interview_type !== 'Behavioral Interview'"
                        class="border-2 rounded-xl py-3 px-2 font-bold text-sm transition-all duration-200 hover:border-orange-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Behavioral
                    </button>

                    <button
                        type="button"
                        [disabled]="isSubmitting"
                        (click)="interviewType('Combined')"
                        [class.bg-orange-500]="interview_type === 'Combined'"
                        [class.text-white]="interview_type === 'Combined'"
                        [class.border-orange-500]="interview_type === 'Combined'"
                        [class.bg-white]="interview_type !== 'Combined'"
                        [class.text-slate-600]="interview_type !== 'Combined'"
                        [class.border-slate-200]="interview_type !== 'Combined'"
                        class="border-2 rounded-xl py-3 px-2 font-bold text-sm transition-all duration-200 hover:border-orange-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Combined
                    </button>
                </div>
                <p *ngIf="!interview_type" class="text-xs text-slate-400">Pick one to continue</p>
            </div>

            <!-- Role -->
            <div class="space-y-2 fade-in" style="animation-delay: 150ms;">
                <label class="text-xs font-bold tracking-[0.15em] text-slate-500 uppercase">Role</label>
                <input
                    type="text"
                    [formControl]="interview_role"
                    [disabled]="isSubmitting"
                    placeholder="Interview for role?"
                    class="w-full border-2 rounded-xl px-4 py-3 text-slate-900 font-semibold outline-none transition-all duration-300 placeholder:text-slate-400 placeholder:font-normal focus:shadow-lg disabled:bg-slate-50 disabled:cursor-not-allowed"
                    [class.border-red-400]="interview_role.invalid && interview_role.touched"
                    [class.focus:border-red-500]="interview_role.invalid && interview_role.touched"
                    [class.focus:shadow-red-200]="interview_role.invalid && interview_role.touched"
                    [class.border-orange-300]="!(interview_role.invalid && interview_role.touched)"
                    [class.focus:border-orange-500]="!(interview_role.invalid && interview_role.touched)"
                    [class.focus:shadow-orange-200]="!(interview_role.invalid && interview_role.touched)"
                >
                <p *ngIf="interview_role.invalid && interview_role.touched" class="text-xs text-red-500 font-medium">Role is required</p>
            </div>

            <!-- Intensity -->
            <div class="space-y-2 fade-in" style="animation-delay: 200ms;">
                <label class="text-xs font-bold tracking-[0.15em] text-slate-500 uppercase">Intensity level</label>
                <input
                    type="text"
                    [formControl]="intensity_level"
                    [disabled]="isSubmitting"
                    placeholder="Eg: Hard, Medium, Easy level"
                    class="w-full border-2 rounded-xl px-4 py-3 text-slate-900 font-semibold outline-none transition-all duration-300 placeholder:text-slate-400 placeholder:font-normal focus:shadow-lg disabled:bg-slate-50 disabled:cursor-not-allowed"
                    [class.border-red-400]="intensity_level.invalid && intensity_level.touched"
                    [class.focus:border-red-500]="intensity_level.invalid && intensity_level.touched"
                    [class.focus:shadow-red-200]="intensity_level.invalid && intensity_level.touched"
                    [class.border-orange-300]="!(intensity_level.invalid && intensity_level.touched)"
                    [class.focus:border-orange-500]="!(intensity_level.invalid && intensity_level.touched)"
                    [class.focus:shadow-orange-200]="!(intensity_level.invalid && intensity_level.touched)"
                >
                <p *ngIf="intensity_level.invalid && intensity_level.touched" class="text-xs text-red-500 font-medium">Intensity level is required</p>
            </div>

            <!-- Start button -->
            <button
                type="button"
                (click)="start_interview()"
                [disabled]="isSubmitting"
                class="fade-in w-full bg-orange-500 hover:bg-orange-600 text-white disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-black text-lg py-4 rounded-xl shadow-lg shadow-orange-500/25 transition-all duration-300 flex items-center justify-center gap-2"
                style="animation-delay: 250ms;"
            >
                <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                {{ isSubmitting ? "Preparing your interview..." : "Start" }}
            </button>

        </div>
    </form>
</div>
