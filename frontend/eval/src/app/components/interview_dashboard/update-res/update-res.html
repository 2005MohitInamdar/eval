<div>
    <div>
        <h1>Upload resume</h1>
        <input type="file" hidden class="border px-3 py-1" (change)="onFileSelected($event)" #fileInput >

        <div appDragnDrop (click)="fileInput.click()" class="border px-5 py-2.5" (filesDropped)="handleDroppedFiles($event)">
            <p>{{fileName || "No File Selected"}}</p>
            <button type="button"  class="border px-2 py-1">Upload</button>
        </div>
    </div>
    <div class="mt-5">
        <form>
            <label>Company: </label>
            <input type="text" placeholder="Enter company where you want to interview" class="border mb-5" [(ngModel)]="desired_company" name="desired_company"><br>
            <label>Desired Role: </label>
            <input type="text" placeholder="Enter desired Role" class="border mb-5" [(ngModel)]="desired_role" name="desired_role">
        </form>
    </div>
    <button (click)="submitResume()" class="border px-5 py-2">Next</button>
</div>
