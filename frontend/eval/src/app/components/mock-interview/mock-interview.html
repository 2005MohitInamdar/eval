<div class="relative min-h-screen bg-white text-slate-900 overflow-hidden flex flex-col">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-orange-100/60 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="relative z-10 flex flex-col h-screen w-full px-4 py-4 md:px-8 md:py-8">

        <div class="flex items-center gap-3 mb-4 shrink-0 fade-in" style="animation-delay: 0ms;">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </div>
            <div>
                <p class="text-[10px] tracking-[0.3em] text-orange-600 font-bold uppercase">Live Session</p>
                <h2 class="text-base font-black uppercase text-slate-900 tracking-tight">Mock Interview</h2>
            </div>
        </div>

        <div class="flex flex-col flex-1 min-h-0 gap-4">

            <div class="flex flex-col md:flex-row flex-1 min-h-0 gap-4">

                <div class="flex-1 min-h-[120px] md:min-h-0 border-2 border-orange-400 bg-white rounded-2xl shadow-xl shadow-orange-100 fade-in" style="animation-delay: 100ms;">
                </div>

                <form class="flex-1 flex flex-col gap-3 min-h-0 fade-in" style="animation-delay: 200ms;">
                    <div class="group flex flex-col flex-1 min-h-0">
                        <div class="flex items-center justify-between mb-2 shrink-0">
                            <label class="block text-[10px] tracking-[0.3em] text-slate-500 font-bold uppercase">
                                Your Response
                            </label>

                            @if(isSpeechSupported){
                                <button
                                    type="button"
                                    (click)="toggleListening()"
                                    [disabled]="isSubmitting"
                                    class="flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest transition-all duration-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                                    [class.bg-orange-500]="isListening"
                                    [class.text-white]="isListening"
                                    [class.border]="!isListening"
                                    [class.border-slate-300]="!isListening"
                                    [class.text-slate-500]="!isListening"
                                    [class.hover:border-orange-400]="!isListening"
                                    [class.hover:text-orange-600]="!isListening"
                                >
                                    <span class="relative flex h-2 w-2">
                                        @if(isListening){
                                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                        }
                                        <span class="relative inline-flex rounded-full h-2 w-2" [class.bg-white]="isListening" [class.bg-slate-400]="!isListening"></span>
                                    </span>
                                    {{ isListening ? 'Listening...' : 'Speak Answer' }}
                                </button>
                            }
                        </div>

                        <div class="relative flex-1 min-h-[160px] md:min-h-0 border-2 rounded-xl bg-white transition-colors duration-300 overflow-hidden"
                             [class.border-orange-500]="isListening"
                             [class.shadow-lg]="isListening"
                             [class.shadow-orange-200]="isListening"
                             [class.border-slate-200]="!isListening"
                             [class.focus-within:border-orange-500]="!isListening"
                             [class.focus-within:shadow-lg]="!isListening"
                             [class.focus-within:shadow-orange-200]="!isListening">
                            <textarea
                                class="w-full h-full bg-transparent border-0 outline-none p-4 text-slate-900 placeholder-slate-400 text-sm resize-none disabled:bg-slate-50 disabled:cursor-not-allowed"
                                placeholder="Type your answer or click 'Speak Answer' to talk..."
                                [formControl]="user_answer"></textarea>
                        </div>

                        @if(!isSpeechSupported){
                            <p class="text-[10px] text-slate-400 mt-1 italic">Voice input isn't supported in this browser — try Chrome or Edge.</p>
                        }
                    </div>

                    <button
                        type="button"
                        (click)="submit()"
                        [disabled]="!user_answer.valid || isSubmitting"
                        class="group relative w-full shrink-0 bg-orange-500 hover:enabled:bg-orange-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-black px-8 py-3.5 rounded-xl shadow-lg shadow-orange-500/25 uppercase tracking-widest text-xs transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer"
                    >
                        <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span>{{ isSubmitting ? "Submitting..." : "Submit Answer" }}</span>
                        <svg *ngIf="!isSubmitting" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
                            class="w-3.5 h-3.5 transition-transform duration-300 group-hover:enabled:translate-x-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                    </button>
                </form>
            </div>

            <div class="relative shrink-0 max-h-[22vh] overflow-y-auto border border-orange-200 bg-orange-50/60 rounded-2xl shadow-xl shadow-orange-100 px-6 py-4 md:px-8 md:py-5 fade-in" style="animation-delay: 0ms;">
                <p class="text-[10px] tracking-[0.3em] text-orange-500 font-bold uppercase mb-2">Question</p>

                @if(first_question){
                    <h1 class="text-sm md:text-base font-semibold leading-snug text-orange-700">{{first_question}}</h1>
                }
                @else if(new_question){
                    <h1 class="text-sm md:text-base font-semibold leading-snug text-orange-700">{{new_question}}</h1>
                }
                @else {
                    <p class="text-slate-400 italic text-sm">Waiting for question...</p>
                }
            </div>
        </div>
    </div>
</div>
