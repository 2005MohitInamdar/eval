<div class="h-screen bg-slate-950 text-slate-100 overflow-hidden font-mono selection:bg-pink-500/30 flex flex-col">

    <div class="absolute inset-0 z-0 opacity-10 bg-[linear-gradient(to_right,#1f2937_1px,transparent_1px),linear-gradient(to_bottom,#1f2937_1px,transparent_1px)] bg-[size:32px_32px]"></div>

    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-cyan-500/8 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="relative z-10 flex flex-col h-full w-full max-w-3xl mx-auto p-4 md:p-8">

        <div class="flex items-center gap-3 mb-4 shrink-0">
            <div class="w-1 h-6 bg-pink-500"></div>
            <div>
                <p class="text-[8px] tracking-[0.4em] text-cyan-400 font-bold uppercase">Live Session</p>
                <h2 class="text-base font-black italic uppercase text-white">Mock Interview</h2>
            </div>
        </div>

        <div class="relative border border-slate-800 bg-slate-900/40 backdrop-blur-sm px-6 py-6 md:px-8 md:py-8 mb-4 flex-[65] min-h-0 overflow-y-auto [clip-path:polygon(0_0,100%_0,100%_92%,96%_100%,0_100%)]">
            <div class="absolute top-0 right-0 w-12 h-12 border-t border-r border-cyan-800/30"></div>
            <p class="text-[9px] tracking-[0.4em] text-slate-500 uppercase mb-3">Question</p>

            @if(first_question){
                <h1 class="text-base md:text-lg font-semibold leading-relaxed text-white">{{first_question}}</h1>
            }
            @else if(new_question){
                <h1 class="text-base md:text-lg font-semibold leading-relaxed text-white">{{new_question}}</h1>
            }
            @else {
                <p class="text-slate-500 italic text-sm">Waiting for question...</p>
            }
        </div>

        <form class="flex flex-col gap-3 flex-[35] min-h-0">
            <div class="group flex flex-col flex-1 min-h-0">
                <div class="flex items-center justify-between mb-2 shrink-0">
                    <label class="block text-[9px] tracking-[0.4em] text-cyan-400 uppercase">
                        Your Response
                    </label>

                    @if(isSpeechSupported){
                        <button
                            type="button"
                            (click)="toggleListening()"
                            class="flex items-center gap-2 px-3 py-1.5 text-[9px] uppercase tracking-widest transition-all duration-300 cursor-pointer"
                            [class.bg-pink-500]="isListening"
                            [class.text-white]="isListening"
                            [class.border]="!isListening"
                            [class.border-slate-700]="!isListening"
                            [class.text-slate-400]="!isListening"
                            [class.hover:border-cyan-400]="!isListening"
                            [class.hover:text-cyan-400]="!isListening"
                        >
                            <span class="relative flex h-2 w-2">
                                @if(isListening){
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                }
                                <span class="relative inline-flex rounded-full h-2 w-2" [class.bg-white]="isListening" [class.bg-slate-500]="!isListening"></span>
                            </span>
                            {{ isListening ? 'Listening...' : 'Speak Answer' }}
                        </button>
                    }
                </div>

                <div class="relative flex-1 min-h-0 border-2 border-slate-700 group-focus-within:border-cyan-400 bg-slate-900/60 transition-colors duration-300"
                     [class.border-pink-500]="isListening">
                    <textarea
                        class="w-full h-full bg-transparent border-0 outline-none p-3 text-white placeholder-slate-600 text-sm tracking-wide resize-none"
                        placeholder="Type your answer or click 'Speak Answer' to talk..."
                        [formControl]="user_answer"></textarea>
                </div>

                @if(!isSpeechSupported){
                    <p class="text-[9px] text-slate-600 mt-1 italic">Voice input isn't supported in this browser — try Chrome or Edge.</p>
                }
            </div>

            <button
                type="button"
                (click)="submit()"
                [disabled]="!user_answer.valid"
                class="group relative w-full sm:w-auto sm:self-end shrink-0 bg-cyan-400 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-slate-950 font-black px-6 py-3 uppercase tracking-widest text-xs [clip-path:polygon(0_0,100%_0,100%_70%,90%_100%,0_100%)] hover:enabled:bg-white transition-all duration-300 flex items-center justify-center gap-2 overflow-hidden cursor-pointer"
            >
                <span class="relative z-10">Submit Answer</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
                    class="w-3.5 h-3.5 relative z-10 transition-transform duration-300 group-hover:enabled:translate-x-1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:enabled:translate-x-full transition-transform duration-700"></div>
            </button>
        </form>
    </div>
</div>
