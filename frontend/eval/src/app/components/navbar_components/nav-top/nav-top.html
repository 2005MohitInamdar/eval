<header class="w-full bg-orange-50 border-b border-orange-200 px-8 py-3">
  <nav class="flex justify-end items-center gap-2">

    <div class="flex items-center gap-2">
      <a routerLink="user_profile" 
         class="p-2 text-slate-600 rounded-lg hover:bg-orange-100 hover:text-orange-700 transition-colors group" 
         title="Profile">
        <lucide-icon [img]="ProfileIcon" class="w-5 h-5 group-hover:scale-110 transition-transform"></lucide-icon>
      </a>

      <a routerLink="settings" 
         class="p-2 text-slate-600 rounded-lg hover:bg-orange-100 hover:text-orange-700 transition-colors group" 
         title="Settings">
        <lucide-icon [img]="SettingsIcon" class="w-5 h-5 group-hover:rotate-45 transition-transform"></lucide-icon>
      </a>

      <div class="w-px h-6 bg-orange-200 mx-2"></div>

      <button class="p-2 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-600 transition-colors group" 
              title="Logout" (click)="logoutUser()">
        <lucide-icon [img]="LogoutIcon" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

  </nav>
</header>
