<div class="h-full font-sans">
    <aside
        class="h-full flex flex-col border-r border-orange-200 bg-orange-50 overflow-hidden transition-all duration-300 ease-in-out px-4"
        [style.width.px]="expanded() ? 256 : 80"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
    >
        <div class="flex items-center h-8 mb-8 mt-2"
             [class.justify-between]="expanded()"
             [class.justify-center]="!expanded()">

            <h1 class="text-2xl fade-in font-black text-blue-600 tracking-tight overflow-hidden whitespace-nowrap transition-all duration-200"
                [style.max-width.px]="expanded() ? 200 : 0"
                [style.opacity]="expanded() ? 1 : 0">
                MockItOut
            </h1>

            <span *ngIf="!expanded()" class="text-xl font-black text-blue-600">M</span>
        </div>

        <nav class="flex flex-col">
            <ul class="space-y-1 text-slate-500">
                <a routerLink="dashboard" routerLinkActive="bg-orange-100 text-orange-600"
                   [title]="!expanded() ? 'Dashboard' : ''"
                   class="flex items-center px-3 py-2 rounded-lg hover:bg-orange-100 hover:text-orange-600 cursor-pointer transition-colors group"
                   [class.justify-center]="!expanded()"
                   [class.gap-3]="expanded()">
                    <lucide-icon [img]="DashboardIcon" class="w-4 h-4 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                    <span class="font-medium text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                          [style.max-width.px]="expanded() ? 160 : 0"
                          [style.opacity]="expanded() ? 1 : 0">Dashboard</span>
                </a>

                <a routerLink="evaluation_report" routerLinkActive="bg-orange-100 text-orange-600"
                   [title]="!expanded() ? 'Evaluation Report' : ''"
                   class="flex items-center px-3 py-2 rounded-lg hover:bg-orange-100 hover:text-orange-600 cursor-pointer transition-colors group"
                   [class.justify-center]="!expanded()"
                   [class.gap-3]="expanded()">
                    <lucide-icon [img]="ReportIcon" class="w-4 h-4 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                    <span class="font-medium text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                          [style.max-width.px]="expanded() ? 160 : 0"
                          [style.opacity]="expanded() ? 1 : 0">Evaluation Report</span>
                </a>

                <!-- <a routerLink="completed_interviews" routerLinkActive="bg-orange-100 text-orange-600"
                   [title]="!expanded() ? 'Completed' : ''"
                   class="flex items-center px-3 py-2 rounded-lg hover:bg-orange-100 hover:text-orange-600 cursor-pointer transition-colors group"
                   [class.justify-center]="!expanded()"
                   [class.gap-3]="expanded()">
                    <lucide-icon [img]="CompletedIcon" class="w-4 h-4 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                    <span class="font-medium text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                          [style.max-width.px]="expanded() ? 160 : 0"
                          [style.opacity]="expanded() ? 1 : 0">Completed</span>
                </a> -->

                <a routerLink="remaining_interviews" routerLinkActive="bg-orange-100 text-orange-600"
                   [title]="!expanded() ? 'Remaining' : ''"
                   class="flex items-center px-3 py-2 rounded-lg hover:bg-orange-100 hover:text-orange-600 cursor-pointer transition-colors group"
                   [class.justify-center]="!expanded()"
                   [class.gap-3]="expanded()">
                    <lucide-icon [img]="RemainingIcon" class="w-4 h-4 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                    <span class="font-medium text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                          [style.max-width.px]="expanded() ? 160 : 0"
                          [style.opacity]="expanded() ? 1 : 0">Remaining</span>
                </a>

                <a routerLink="resume" routerLinkActive="bg-orange-100 text-orange-600"
                   [title]="!expanded() ? 'Resume' : ''"
                   class="flex items-center px-3 py-2 rounded-lg hover:bg-orange-100 hover:text-orange-600 cursor-pointer transition-colors group"
                   [class.justify-center]="!expanded()"
                   [class.gap-3]="expanded()">
                    <lucide-icon [img]="ResumeIcon" class="w-4 h-4 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                    <span class="font-medium text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                          [style.max-width.px]="expanded() ? 160 : 0"
                          [style.opacity]="expanded() ? 1 : 0">Resume</span>
                </a>
            </ul>
        </nav>

        <div class="mt-auto pt-6 border-t border-orange-200">
            <a routerLink="user_profile" routerLinkActive="bg-orange-100 text-orange-600"
               [title]="!expanded() ? 'Profile' : ''"
               class="flex items-center px-3 py-2 font-medium text-slate-700 hover:text-orange-600 transition-colors group"
               [class.justify-center]="!expanded()"
               [class.gap-3]="expanded()">
                <lucide-icon [img]="ProfileIcon" class="w-5 h-5 text-slate-400 group-hover:text-orange-600 flex-shrink-0"></lucide-icon>
                <span class="text-sm overflow-hidden whitespace-nowrap transition-all duration-200"
                      [style.max-width.px]="expanded() ? 160 : 0"
                      [style.opacity]="expanded() ? 1 : 0">Profile</span>
            </a>
        </div>
    </aside>
</div>
