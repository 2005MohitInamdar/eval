<div class="relative min-h-screen bg-white text-slate-900 overflow-hidden">

    <div class="absolute top-1/2 right-[10%] -translate-y-1/2 w-[600px] h-[600px] rounded-full pointer-events-none bg-orange-100/70 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 w-[400px] h-[400px] rounded-full pointer-events-none bg-blue-100/40 blur-3xl"></div>

    <div class="relative z-10 w-[85%] max-w-7xl mx-auto min-h-screen flex flex-col">

        <header class="flex-none pt-10 fade-in" style="animation-delay: 0ms;">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-300">
                    <span class="text-white font-black text-xl">M</span>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-slate-900">MockItOut</h2>
            </div>
        </header>

        <main class="flex-grow flex items-center py-16">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center w-full">

                <div class="space-y-8 fade-in" style="animation-delay: 100ms;">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>
                        <p class="text-xs font-bold tracking-[0.3em] text-orange-600 uppercase">Practice with confidence</p>
                    </div>

                    <h1 class="text-5xl md:text-6xl xl:text-7xl font-black leading-[1.05] tracking-tight text-slate-900">
                        Ace your next<br/>
                        <span class="text-orange-500">interview.</span>
                    </h1>

                    <p class="text-lg md:text-xl text-slate-600 leading-relaxed max-w-md">
                        Simulate high-stakes interviews with a precision AI interviewer, built around your resume and the role you want.
                    </p>

                    <button
                        routerLink="/auth/login"
                        class="group relative bg-orange-500 hover:bg-orange-600 text-white font-black text-lg px-10 py-4 rounded-xl shadow-lg shadow-orange-500/25 transition-all duration-300 flex items-center gap-3"
                    >
                        Get Started
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor"
                            class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                    </button>
                </div>

                <div class="hidden lg:flex justify-center fade-in" style="animation-delay: 200ms;">
                    <div class="relative w-full max-w-md aspect-[4/5] bg-white border border-slate-200 rounded-3xl shadow-xl p-8 flex flex-col justify-between">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-200"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-200"></span>
                        </div>

                        <div class="space-y-4">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-300">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="w-7 h-7">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                </svg>
                            </div>
                            <p class="text-slate-900 font-bold text-lg leading-snug">
                                "Tell me about a time you handled a tight deadline."
                            </p>
                            <p class="text-sm text-slate-500">AI Interviewer · Live session</p>
                        </div>

                        <div class="flex gap-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-orange-700 bg-orange-100 px-3 py-1 rounded-full">Behavioral</span>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Round 1</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

    </div>
</div>
