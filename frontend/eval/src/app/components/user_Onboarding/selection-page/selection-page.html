<div class="relative min-h-screen bg-white text-slate-900 flex items-center justify-center p-6 md:p-12 overflow-hidden">

    <div class="absolute top-1/2 right-[8%] -translate-y-1/2 w-[700px] h-[700px] rounded-full pointer-events-none z-0 bg-orange-100/60 blur-3xl"></div>

    <div class="relative z-10 w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-8 items-center">

        <div class="flex flex-col justify-center max-w-xl fade-in" style="animation-delay: 0ms;">
            <div class="flex items-center gap-2 mb-6">
                <span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>
                <p class="text-xs md:text-sm font-bold tracking-[0.3em] text-orange-600 uppercase">Before you walk in</p>
            </div>

            <h1 class="text-5xl md:text-6xl xl:text-7xl font-black leading-[1.05] tracking-tight text-slate-900 mb-6">
                Let's set<br/><span class="text-orange-500">the scene.</span>
            </h1>

            <p class="text-lg md:text-xl text-slate-600 leading-relaxed max-w-md">
                Tell us who you're meeting and what for <br>Every question we ask will be built around it.
            </p>
        </div>

        <div class="w-full flex justify-center lg:justify-end fade-in" style="animation-delay: 200ms;">
            <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 md:p-9 shadow-xl space-y-7">

                <div class="space-y-2">
                    <label for="company" class="text-xs font-bold tracking-[0.15em] text-slate-500 uppercase">
                        Interviewing with
                    </label>
                    <input
                        id="company"
                        type="text"
                        [(ngModel)]="desired_company"
                        required
                        [disabled]="isSubmitting"
                        placeholder="Company name"
                        class="w-full border-2 border-orange-300 rounded-xl px-4 py-3 text-slate-900 text-lg font-semibold outline-none transition-all duration-300 placeholder:text-slate-400 placeholder:font-normal placeholder:text-base focus:border-orange-500 focus:shadow-lg focus:shadow-orange-200 disabled:bg-slate-50 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed"
                    >
                </div>

                <div class="space-y-2">
                    <label for="role" class="text-xs font-bold tracking-[0.15em] text-slate-500 uppercase">
                        Interviewing for
                    </label>
                    <input
                        id="role"
                        type="text"
                        [(ngModel)]="desired_role"
                        required
                        [disabled]="isSubmitting"
                        placeholder="Role or job title"
                        class="w-full border-2 border-orange-300 rounded-xl px-4 py-3 text-slate-900 text-lg font-semibold outline-none transition-all duration-300 placeholder:text-slate-400 placeholder:font-normal placeholder:text-base focus:border-orange-500 focus:shadow-lg focus:shadow-orange-200 disabled:bg-slate-50 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed"
                    >
                </div>

                <button
                    type="button"
                    (click)="submit_desired_selection()"
                    [disabled]="!desired_company || !desired_role || isSubmitting"
                    class="group relative w-full bg-orange-500 hover:bg-orange-600 text-white disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed disabled:pointer-events-none font-black text-lg px-8 py-4 rounded-xl shadow-lg shadow-orange-500/25 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 mt-2"
                >
                    <span>{{ isSubmitting ? "Setting the scene..." : "Start the interview" }}</span>

                    <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>

                    <svg *ngIf="!isSubmitting" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor"
                        class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                    </svg>
                </button>

                <p class="text-center text-xs font-bold tracking-[0.1em] uppercase transition-colors duration-500"
                   [class.text-orange-600]="desired_company && desired_role"
                   [class.text-slate-400]="!(desired_company && desired_role)">
                    {{ (desired_company && desired_role) ? 'Scene is set — whenever you\'re ready' : 'Fill both to bring up the lights' }}
                </p>
            </div>
        </div>
    </div>
</div>
