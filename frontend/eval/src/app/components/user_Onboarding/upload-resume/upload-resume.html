<div class="min-h-screen bg-white text-slate-900">
    <app-nav-top></app-nav-top>
    <div class="w-[80%] mx-auto py-[10vh]">
        <div class="flex items-center gap-5 mb-12 fade-in" style="animation-delay: 0ms;">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-300">
                <span class="text-white font-black text-3xl">R</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight">Upload Resume</h1>
        </div>

        <input type="file" hidden (change)="onFileSelected($event)" #fileInput>
        <div 
            appDragnDrop 
            (click)="fileInput.click()" 
            (filesDropped)="handleDroppedFiles($event)"
            [class.opacity-50]="isUploading"
            [class.pointer-events-none]="isUploading"
            class="fade-in border-2 border-dashed border-orange-400 bg-orange-50 hover:border-orange-700 hover:shadow-[inset_0_0_20px_rgba(249,115,22,0.4)] rounded-xl px-12 py-12 flex items-center justify-center md:justify-start gap-10 cursor-pointer transition-all duration-300"
            style="animation-delay: 200ms;"
        >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden md:block w-24 h-24 text-orange-400 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15m0-3-3-3m0 0-3 3m3-3V15" />
            </svg>

            <div class="hidden md:flex flex-1 flex-col items-center gap-3 text-center">
                <p class="text-2xl font-bold text-slate-700">{{fileName || "No File Selected"}}</p>
                <p class="text-base text-slate-600 font-medium">Drag & drop your resume here, or click to browse</p>
                <button type="button" 
                    [disabled]="isUploading"
                    class="w-fit bg-orange-500 hover:bg-orange-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-lg px-8 py-3 rounded-xl transition-all duration-300 flex items-center gap-2">
                    <svg *ngIf="isUploading" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    {{ isUploading ? "Uploading..." : "Upload" }}
                </button>
            </div>

            <button type="button" 
                [disabled]="isUploading"
                class="md:hidden bg-orange-500 hover:bg-orange-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-lg px-8 py-3 rounded-xl transition-all duration-300 flex items-center gap-2">
                <svg *ngIf="isUploading" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                {{ isUploading ? "Uploading..." : "Upload" }}
            </button>

            <div class="hidden md:flex border-l-2 border-orange-200 pl-10 self-stretch flex-col justify-center flex-shrink-0">
                <p class="text-base font-bold uppercase tracking-widest text-orange-500 mb-3">Supported Formats</p>
                <div class="flex gap-3 flex-wrap">
                    <span class="text-base font-semibold bg-white border border-orange-300 text-orange-600 px-4 py-2 rounded-lg">PDF</span>
                    <span class="text-base font-semibold bg-white border border-orange-300 text-orange-600 px-4 py-2 rounded-lg">DOCX</span>
                    <span class="text-base font-semibold bg-white border border-orange-300 text-orange-600 px-4 py-2 rounded-lg">DOC</span>
                </div>
                <p class="text-sm text-slate-500 mt-4">Max file size: 5MB</p>
            </div>
        </div>

        @if (uploadError) {
            <p class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-center text-sm font-medium text-red-700" role="alert">
                {{ uploadError }} You can select the file again and retry.
            </p>
        }

        <button 
            (click)="submitResume()" 
            [disabled]="!fileName || isUploading"
            [class.bg-blue-600]="fileName && !isUploading"
            [class.hover:bg-blue-700]="fileName && !isUploading"
            [class.text-white]="fileName"
            [class.shadow-lg]="fileName && !isUploading"
            [class.shadow-blue-500/25]="fileName && !isUploading"
            [class.bg-slate-200]="!fileName || isUploading"
            [class.text-slate-400]="!fileName"
            [class.cursor-not-allowed]="!fileName || isUploading"
            class="fade-in w-full mt-8 py-5 font-black text-3xl rounded-xl transition-all duration-300 flex items-center justify-center gap-3"
            style="animation-delay: 400ms;"
        >
            <svg *ngIf="isUploading" class="animate-spin h-7 w-7 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            {{ isUploading ? "Parsing your resume..." : "Next" }}
        </button>
    </div>
</div>
